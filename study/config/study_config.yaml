# Phase 0 synthetic validation settings

diversity:
  mean_jaccard_threshold: 0.85
  min_profiles: 45

research:
  max_mean_multiset_jaccard: 0.92
  min_contrast_pass_rate: 0.8
  min_mean_judge_score: 3.5
  judge_sample_size: 15
  min_within_cluster_multiset_jaccard: 0.65
  max_contrast_cluster_multiset_jaccard: 0.70
  min_style_control_pass_rate: 0.8
  min_rule_pass_rate: 0.85
  min_profile_pass_rate: 0.80
  contrasting_cluster_pairs:
    - [humanities_social, cs_technical]
    - [humanities_social, business_mba]
    - [business_mba, cs_technical]

survey_question_ids:
  - goals_1
  - goals_2
  - prereq_1
  - learning_1
  - bloom_remember
  - bloom_understand
  - bloom_apply
  - bloom_analyze
